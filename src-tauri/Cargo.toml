[package]
name = "patchmark"
version = "0.1.0"
description = "A quiet, local-first Markdown editor"
authors = ["PatchMark contributors"]
edition = "2021"

[lib]
name = "patchmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

