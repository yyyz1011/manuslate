name: Bug report
description: Report a reproducible problem in Manuslate
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Manuslate more dependable.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. See…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Manuslate version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "macOS 15.6, Windows 11, or Linux distribution"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots or additional context
      description: Drag screenshots here. Remove private document content first.
